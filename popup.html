<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        /* Instrument panel: pale chassis, recessed readout, one signal colour.
           Sized for a thumb on a phone first; the desktop popup just centres. */
        :root {
            --chassis: #D9D6CF;
            --chassis-hi: #E7E4DD;
            --chassis-edge: #C2BEB5;
            --display: #1E211F;
            --display-ink: #DCE7D8;
            --display-dim: #4A544B;
            --signal: #DC5314;
            --signal-press: #B3410F;
            --go: #3F7A4A;
            --halt: #A32F28;
            --ink: #262624;
            --ink-soft: #6E6B64;
            --tag-neutral: #6E6B64;

            --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", sans-serif;
            --mono: ui-monospace, "SF Mono", SFMono-Regular, "Roboto Mono", Menlo, monospace;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --chassis: #26262A;
                --chassis-hi: #313136;
                --chassis-edge: #17171A;
                --display: #131513;
                --ink: #E9E7E2;
                --ink-soft: #9B968D;
                /* --ink-soft is too light to carry white tag text here. */
                --tag-neutral: #55524C;
            }
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0 auto;
            max-width: 420px;
            padding: 14px 14px 22px;
            background: var(--chassis);
            color: var(--ink);
            font-family: var(--sans);
            font-size: 15px;
            line-height: 1.4;
            -webkit-font-smoothing: antialiased;
        }

        /* Micro-labels, Braun-style: small, spaced, quiet. */
        .label {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--ink-soft);
        }

        /* --- State band: readable at arm's length, before you read anything else --- */
        .band {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 9px 12px;
            border-radius: 8px 8px 0 0;
            background: var(--ink-soft);
            color: #fff;
        }

        .band-text {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        .lamp {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: currentColor;
            flex: none;
        }

        body[data-state="running"] .band,
        body[data-state="stopping"] .band {
            background: var(--signal);
        }

        body[data-state="done"] .band {
            background: var(--go);
        }

        body[data-state="stopped"] .band,
        body[data-state="error"] .band {
            background: var(--halt);
        }

        body[data-state="running"] .lamp {
            animation: pulse 1.1s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.25;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .lamp {
                animation: none !important;
            }
        }

        /* --- The readout: the one thing this panel is remembered by --- */
        .display {
            background: var(--display);
            border-radius: 0 0 8px 8px;
            padding: 20px 16px 16px;
            text-align: center;
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.45);
        }

        .count {
            font-family: var(--mono);
            font-size: 60px;
            font-weight: 500;
            line-height: 1;
            letter-spacing: 0.02em;
            color: var(--display-ink);
            font-variant-numeric: tabular-nums;
        }

        /* Leading zeros sit back like an odometer's unturned digits. */
        .count .lead {
            color: var(--display-dim);
        }

        .count-label {
            margin-top: 6px;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--display-dim);
        }

        .readout-line {
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid rgba(220, 231, 216, 0.14);
            font-family: var(--mono);
            font-size: 11.5px;
            line-height: 1.45;
            color: var(--display-ink);
            min-height: 2.9em;
            overflow-wrap: anywhere;
        }

        /* --- Controls --- */
        .controls {
            display: grid;
            gap: 8px;
            margin-top: 14px;
        }

        button {
            width: 100%;
            min-height: 54px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-family: var(--sans);
            font-size: 16px;
            font-weight: 650;
            letter-spacing: 0.04em;
            color: #fff;
            background: var(--signal);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        button:active {
            background: var(--signal-press);
            transform: translateY(1px);
        }

        button:focus-visible {
            outline: 3px solid var(--ink);
            outline-offset: 2px;
        }

        button[disabled] {
            background: var(--chassis-edge);
            color: var(--ink-soft);
            cursor: default;
            transform: none;
        }

        #stopBtn {
            background: transparent;
            color: var(--halt);
            border: 2px solid var(--halt);
            min-height: 48px;
        }

        #stopBtn:active {
            background: var(--halt);
            color: #fff;
        }

        #stopBtn[disabled] {
            background: transparent;
            border-color: var(--chassis-edge);
            color: var(--ink-soft);
        }

        /* --- Folded-away settings: needed rarely, so not in the way --- */
        details {
            margin-top: 16px;
            border-top: 1px solid var(--chassis-edge);
        }

        summary {
            padding: 13px 2px;
            cursor: pointer;
            list-style: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--ink-soft);
        }

        summary::-webkit-details-marker {
            display: none;
        }

        summary::after {
            content: "+";
            font-size: 15px;
            font-weight: 400;
        }

        details[open] summary::after {
            content: "−";
        }

        .field {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 9px 2px;
        }

        .field label {
            font-size: 13.5px;
            color: var(--ink);
            flex: 1;
        }

        .field input[type="text"],
        .field input[type="number"] {
            width: 108px;
            flex: none;
            padding: 9px 10px;
            border: 1px solid var(--chassis-edge);
            border-radius: 6px;
            background: var(--chassis-hi);
            color: var(--ink);
            font-family: var(--mono);
            font-size: 14px;
            text-align: right;
        }

        .field input:focus-visible {
            outline: 2px solid var(--signal);
            outline-offset: 1px;
        }

        .field-stack {
            display: block;
            padding: 9px 2px;
        }

        .field-stack .row {
            display: flex;
            justify-content: space-between;
            font-size: 13.5px;
            margin-bottom: 7px;
        }

        .field-stack .row output {
            font-family: var(--mono);
            color: var(--ink-soft);
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--signal);
        }

        /* --- History as a scannable table --- */
        .log-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 22px 0 8px;
        }

        .link-btn {
            width: auto;
            min-height: 0;
            padding: 4px 0;
            background: none;
            border: none;
            color: var(--ink-soft);
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            text-decoration: underline;
        }

        .link-btn:active {
            background: none;
            color: var(--halt);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th {
            padding: 0 0 6px;
            border-bottom: 1px solid var(--chassis-edge);
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--ink-soft);
            text-align: left;
        }

        td {
            padding: 9px 0;
            border-bottom: 1px solid var(--chassis-edge);
            vertical-align: middle;
        }

        th.num,
        td.num {
            text-align: right;
            font-family: var(--mono);
            font-variant-numeric: tabular-nums;
        }

        th.end,
        td.end {
            text-align: right;
            width: 74px;
        }

        .date {
            color: var(--ink);
        }

        .time {
            color: var(--ink-soft);
            font-size: 11.5px;
        }

        .tag {
            display: inline-block;
            padding: 2px 7px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 650;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: #fff;
        }

        .tag.done {
            background: var(--go);
        }

        .tag.stopped {
            background: var(--tag-neutral);
        }

        .tag.interrupted {
            background: var(--halt);
        }

        .empty {
            padding: 18px 0;
            color: var(--ink-soft);
            font-size: 13.5px;
        }
    </style>
</head>

<body data-state="idle">
    <div class="band">
        <span class="lamp"></span>
        <span class="band-text" id="bandText">Připraveno</span>
    </div>

    <div class="display">
        <div class="count" id="count" aria-live="off">0000</div>
        <div class="count-label">Pozváno</div>
        <p class="readout-line" id="status" role="status">Otevři seznam reakcí a spusť.</p>
    </div>

    <div class="controls">
        <button id="startBtn">Spustit</button>
        <button id="stopBtn" disabled>Zastavit</button>
    </div>

    <details>
        <summary>Nastavení</summary>

        <div class="field">
            <label for="string">Text tlačítka</label>
            <input type="text" id="string" value="Pozvat">
        </div>

        <div class="field-stack">
            <div class="row">
                <label for="delay">Prodleva mezi pozvánkami</label>
                <output id="delayValue" for="delay">0,5 s</output>
            </div>
            <input type="range" id="delay" min="0.5" max="10" value="0.5" step="0.5">
        </div>

        <div class="field">
            <label for="limit">Maximálně pozvánek</label>
            <input type="number" id="limit" value="1000" min="1">
        </div>

        <div class="field">
            <label for="pauseAfter">Pauza 30 s po</label>
            <input type="number" id="pauseAfter" value="200" min="1">
        </div>

        <div class="field">
            <label for="scrollDelay">Čekání po scrollu (ms)</label>
            <input type="number" id="scrollDelay" value="500" min="100" step="100">
        </div>

        <div class="field">
            <label for="noButton">Pokusů scrollování</label>
            <input type="number" id="noButton" value="2000" min="1">
        </div>
    </details>

    <div class="log-head">
        <span class="label">Historie</span>
        <button class="link-btn" id="clearHistoryBtn">Vymazat</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>Datum</th>
                <th class="num">Počet</th>
                <th class="end">Konec</th>
            </tr>
        </thead>
        <tbody id="historyBody"></tbody>
    </table>

    <script src="popup.js"></script>
</body>

</html>
